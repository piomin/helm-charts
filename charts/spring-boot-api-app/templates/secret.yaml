{{- if .Values.secrets.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.name }}
  labels:
    app: {{ .Values.app.name }}
    env: {{ .Values.app.environment }}
    owner: {{ .Values.app.owner }}
    {{- include "spring-boot-api-app.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- toYaml .Values.secrets.values | nindent 2 }}
{{- end }}