suite: test secret
values:
  - ./values/test.yaml
templates:
  - templates/secret.yaml
  - templates/deployment.yaml
tests:
  - it: should not render secret nor envFrom by default
    asserts:
      - hasDocuments:
          count: 0
        template: templates/secret.yaml
      - notExists:
          path: spec.template.spec.containers[0].envFrom
        template: templates/deployment.yaml
  - it: should render secret and reference it with envFrom
    set:
      secrets:
        enabled: true
        values:
          DB_USER: admin
          DB_PASS: s3cret
    asserts:
      - isKind:
          of: Secret
        template: templates/secret.yaml
      - equal:
          path: metadata.name
          value: sample-spring-boot-api
        template: templates/secret.yaml
      - equal:
          path: stringData
          value:
            DB_USER: admin
            DB_PASS: s3cret
        template: templates/secret.yaml
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: sample-spring-boot-api
        template: templates/deployment.yaml
