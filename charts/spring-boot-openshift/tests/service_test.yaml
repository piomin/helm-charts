suite: test service
values:
  - ./values/test.yaml
templates:
  - templates/service.yaml
tests:
  - it: should render ClusterIP service with defaults
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: sample-spring-boot-api
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.selector.app
          value: sample-spring-boot-api
      - equal:
          path: spec.ports
          value:
            - port: 8080
              name: http
  - it: should use service type from values
    set:
      service.type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
  - it: should expose every configured port
    set:
      ports:
        - name: http
          value: 8080
        - name: metrics
          value: 9090
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 2
      - contains:
          path: spec.ports
          content:
            port: 9090
            name: metrics
  - it: should reject unsupported service type
    set:
      service.type: ExternalName
    asserts:
      - failedTemplate: {}
